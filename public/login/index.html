<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>登录</title>
  <link rel="stylesheet" href="/login/login.css" />
</head>
<body>
  <canvas id="ripples" aria-hidden="true"></canvas>
  <main class="wrap">
    <form class="card" id="login-form" autocomplete="on" novalidate>
      <h1>登录</h1>
      <div class="error" id="error" role="alert"></div>
      <label for="username">用户名</label>
      <input id="username" name="username" type="text" autocomplete="username" required autofocus />
      <label for="password">密码</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required />
      <button class="submit" id="submit" type="submit">登录</button>
      <a class="register-link" id="reg-link" href="/register/">没有账号？去注册</a>
      <a class="back" href="/">← 返回首页</a>
    </form>
  </main>

  <script src="/login/login.js"></script>
</body>
</html>
