<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>登录</title>
  <style>
    :root {
      --fg: #1a1a1a;
      --muted: #6b6b6b;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      color: var(--fg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                   "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei",
                   sans-serif;
      font-size: 16px;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }
    body {
      background: url('/image/IMG_20250703_100031.jpeg') center/cover no-repeat fixed;
      position: relative;
      overflow: hidden;
    }
    /* 底蒙版：更不透明，照片弱化为底色 */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: rgba(255, 255, 255, 0.40);
      backdrop-filter: blur(8px) saturate(120%);
      -webkit-backdrop-filter: blur(8px) saturate(120%);
      pointer-events: none;
      z-index: 0;
      animation: maskIn 1.1s cubic-bezier(0.22, 0.61, 0.36, 1) both;
    }
    /* 雨滴涟漪 canvas */
    #ripples {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }
    .wrap { z-index: 2; }

    @keyframes maskIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }

    .wrap {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      width: 100%;
      max-width: 380px;
      padding: 40px 32px;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(20px) saturate(140%);
      -webkit-backdrop-filter: blur(20px) saturate(140%);
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.6);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
      animation: fadeUp 0.9s cubic-bezier(0.22, 0.61, 0.36, 1) both;
    }

    h1 {
      font-family: Georgia, "Times New Roman", "Songti SC", serif;
      font-weight: 400;
      font-size: 28px;
      margin: 0 0 8px;
      text-align: center;
    }
    .subtitle {
      color: var(--muted);
      text-align: center;
      margin: 0 0 28px;
      font-size: 14px;
    }

    label {
      display: block;
      font-size: 13px;
      color: var(--muted);
      margin: 0 0 6px;
    }
    input[type=text], input[type=password] {
      width: 100%;
      padding: 12px 14px;
      font: inherit;
      font-size: 15px;
      color: var(--fg);
      background: rgba(255, 255, 255, 0.6);
      border: 1px solid rgba(0, 0, 0, 0.1);
      border-radius: 10px;
      margin: 0 0 16px;
      outline: none;
      transition: border-color 0.2s ease, background 0.2s ease;
    }
    input:focus {
      border-color: #3b82f6;
      background: rgba(255, 255, 255, 0.9);
    }

    .submit {
      width: 100%;
      padding: 12px;
      background: #3b82f6;
      color: #fff;
      border: none;
      border-radius: 10px;
      font: inherit;
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      margin-top: 8px;
      transition: background 0.2s ease, transform 0.15s ease;
    }
    .submit:hover  { background: #2563eb; }
    .submit:active { transform: scale(0.98); }
    .submit:disabled { opacity: 0.6; cursor: not-allowed; }

    .error {
      color: #b91c1c;
      background: rgba(220, 38, 38, 0.08);
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 14px;
      margin: 0 0 16px;
      display: none;
    }
    .error.is-visible { display: block; }

    .forgot {
      display: block;
      width: max-content;
      margin: 14px auto 0;
      font-size: 13px;
      color: var(--muted);
      text-decoration: none;
    }
    .forgot:hover { color: var(--fg); }

    .back {
      display: block;
      text-align: center;
      margin-top: 14px;
      font-size: 13px;
      color: var(--muted);
      text-decoration: none;
    }
    .back:hover { color: var(--fg); }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <canvas id="ripples" aria-hidden="true"></canvas>
  <main class="wrap">
    <form class="card" id="login-form" autocomplete="on" novalidate>
      <h1>登录</h1>
      <p class="subtitle">进入后台管理</p>
      <div class="error" id="error" role="alert"></div>
      <label for="username">用户名</label>
      <input id="username" name="username" type="text" autocomplete="username" required autofocus />
      <label for="password">密码</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required />
      <button class="submit" id="submit" type="submit">登录</button>
      <a class="back" href="/">← 返回首页</a>
    </form>
  </main>

  <script>
    (() => {
      const form = document.getElementById('login-form');
      const err  = document.getElementById('error');
      const btn  = document.getElementById('submit');
      const userEl = document.getElementById('username');
      const passEl = document.getElementById('password');

      const showError = (msg) => {
        err.textContent = msg;
        err.classList.add('is-visible');
      };
      const hideError = () => err.classList.remove('is-visible');

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        hideError();
        const username = userEl.value.trim();
        const password = passEl.value;
        if (!username || !password) {
          showError('请输入用户名和密码');
          return;
        }
        btn.disabled = true;
        btn.textContent = '登录中…';
        try {
          const res = await fetch('/api/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, password }),
          });
          if (res.status === 204) {
            window.location.href = '/admin/';
            return;
          }
          if (res.status === 429) { showError('尝试次数过多，请稍后再试'); return; }
          if (res.status === 401) { showError('用户名或密码错误'); return; }
          showError('登录失败 (' + res.status + ')');
        } catch {
          showError('网络错误');
        } finally {
          btn.disabled = false;
          btn.textContent = '登录';
        }
      });
    })();

    // —— 雨滴涟漪动画 ——
    (() => {
      const canvas = document.getElementById('ripples');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      let w = 0, h = 0, dpr = Math.min(window.devicePixelRatio || 1, 2);
      const ripples = [];
      const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

      function resize() {
        w = canvas.clientWidth;
        h = canvas.clientHeight;
        canvas.width  = Math.floor(w * dpr);
        canvas.height = Math.floor(h * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }
      resize();
      window.addEventListener('resize', resize);

      function spawn() {
        ripples.push({
          x: Math.random() * w,
          y: Math.random() * h * 0.85,         // 集中在中上部，更像雨滴从天上落
          maxR: 70 + Math.random() * 70,
          peak:  0.55 + Math.random() * 0.30,
          life:  0,
          ttl:   90 + Math.random() * 50,
        });
        if (ripples.length > 28) ripples.shift();
      }

      let lastSpawn = 0;
      function loop(now) {
        if (document.visibilityState === 'hidden') {
          requestAnimationFrame(loop);
          return;
        }
        if (!lastSpawn) lastSpawn = now;
        if (now - lastSpawn > 280 + Math.random() * 180) {
          spawn();
          lastSpawn = now;
        }

        ctx.clearRect(0, 0, w, h);

        for (let i = ripples.length - 1; i >= 0; i--) {
          const r = ripples[i];
          r.life += 1;
          const t = r.life / r.ttl;
          if (t >= 1) { ripples.splice(i, 1); continue; }

          // 半径随时间扩散
          const radius = r.maxR * Math.pow(t, 0.7);
          // 透明度：先升后降（撞地瞬间最强）
          const opacity = r.peak * Math.sin(Math.PI * t);

          // 外圈
          ctx.beginPath();
          ctx.arc(r.x, r.y, radius, 0, Math.PI * 2);
          ctx.strokeStyle = `rgba(255, 255, 255, ${(opacity * 0.85).toFixed(3)})`;
          ctx.lineWidth = 1.6;
          ctx.stroke();

          // 内圈（错位感）
          if (radius > 14) {
            ctx.beginPath();
            ctx.arc(r.x, r.y, radius * 0.62, 0, Math.PI * 2);
            ctx.strokeStyle = `rgba(255, 255, 255, ${(opacity * 0.45).toFixed(3)})`;
            ctx.lineWidth = 1.0;
            ctx.stroke();
          }

          // 中心微闪（仅前 25% 寿命）
          if (t < 0.25) {
            const flash = (1 - t / 0.25) * 0.35;
            ctx.beginPath();
            ctx.arc(r.x, r.y, 2 + 4 * (1 - t / 0.25), 0, Math.PI * 2);
            ctx.fillStyle = `rgba(255, 255, 255, ${flash.toFixed(3)})`;
            ctx.fill();
          }
        }

        requestAnimationFrame(loop);
      }

      if (!reduceMotion) {
        requestAnimationFrame(loop);
      } else {
        // 减少动效用户：画几个静态圈
        for (let k = 0; k < 6; k++) spawn();
        for (let i = ripples.length - 1; i >= 0; i--) {
          const r = ripples[i];
          const radius = r.maxR * 0.7;
          ctx.beginPath();
          ctx.arc(r.x, r.y, radius, 0, Math.PI * 2);
          ctx.strokeStyle = 'rgba(255,255,255,0.4)';
          ctx.lineWidth = 1.4;
          ctx.stroke();
        }
      }
    })();
  </script>
</body>
</html>
