<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>登录</title>
  <style>
    :root {
      --fg: #1a1a1a;
      --muted: #6b6b6b;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      color: var(--fg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                   "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei",
                   sans-serif;
      font-size: 16px;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }
    body {
      background: url('/image/IMG_20250703_100031.jpeg') center/cover no-repeat fixed;
      position: relative;
      overflow: hidden;
    }
    /* 底蒙版：更不透明，照片弱化为底色 */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: rgba(255, 255, 255, 0.40);
      backdrop-filter: blur(8px) saturate(120%);
      -webkit-backdrop-filter: blur(8px) saturate(120%);
      pointer-events: none;
      z-index: 0;
      animation: maskIn 1.1s cubic-bezier(0.22, 0.61, 0.36, 1) both;
    }
    /* 雨滴涟漪 canvas */
    #ripples {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }
    .wrap { z-index: 2; }

    @keyframes maskIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }

    .wrap {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      width: 100%;
      max-width: 380px;
      padding: 40px 32px;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(20px) saturate(140%);
      -webkit-backdrop-filter: blur(20px) saturate(140%);
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.6);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
      animation: fadeUp 0.9s cubic-bezier(0.22, 0.61, 0.36, 1) both;
    }

    h1 {
      font-family: Georgia, "Times New Roman", "Songti SC", serif;
      font-weight: 400;
      font-size: 28px;
      margin: 0 0 8px;
      text-align: center;
    }
    .subtitle {
      color: var(--muted);
      text-align: center;
      margin: 0 0 28px;
      font-size: 14px;
    }

    label {
      display: block;
      font-size: 13px;
      color: var(--muted);
      margin: 0 0 6px;
    }
    input[type=text], input[type=password] {
      width: 100%;
      padding: 12px 14px;
      font: inherit;
      font-size: 15px;
      color: var(--fg);
      background: rgba(255, 255, 255, 0.6);
      border: 1px solid rgba(0, 0, 0, 0.1);
      border-radius: 10px;
      margin: 0 0 16px;
      outline: none;
      transition: border-color 0.2s ease, background 0.2s ease;
    }
    input:focus {
      border-color: #3b82f6;
      background: rgba(255, 255, 255, 0.9);
    }

    .submit {
      width: 100%;
      padding: 12px;
      background: #3b82f6;
      color: #fff;
      border: none;
      border-radius: 10px;
      font: inherit;
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      margin-top: 8px;
      transition: background 0.2s ease, transform 0.15s ease;
    }
    .submit:hover  { background: #2563eb; }
    .submit:active { transform: scale(0.98); }
    .submit:disabled { opacity: 0.6; cursor: not-allowed; }

    .error {
      color: #b91c1c;
      background: rgba(220, 38, 38, 0.08);
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 14px;
      margin: 0 0 16px;
      display: none;
    }
    .error.is-visible { display: block; }

    .forgot {
      display: block;
      width: max-content;
      margin: 14px auto 0;
      font-size: 13px;
      color: var(--muted);
      text-decoration: none;
    }
    .forgot:hover { color: var(--fg); }

    .back {
      display: block;
      text-align: center;
      margin-top: 14px;
      font-size: 13px;
      color: var(--muted);
      text-decoration: none;
    }
    .back:hover { color: var(--fg); }

    .register-link {
      display: block;
      width: max-content;
      margin: 18px auto 0;
      font-size: 13px;
      color: var(--muted);
      text-decoration: none;
    }
    .register-link:hover { color: var(--fg); }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <canvas id="ripples" aria-hidden="true"></canvas>
  <main class="wrap">
    <form class="card" id="login-form" autocomplete="on" novalidate>
      <h1>登录</h1>
      <div class="error" id="error" role="alert"></div>
      <label for="username">用户名</label>
      <input id="username" name="username" type="text" autocomplete="username" required autofocus />
      <label for="password">密码</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required />
      <button class="submit" id="submit" type="submit">登录</button>
      <a class="register-link" id="reg-link" href="/register/">没有账号？去注册</a>
      <a class="back" href="/">← 返回首页</a>
    </form>
  </main>

  <script src="/login/login.js"></script>
</body>
</html>
