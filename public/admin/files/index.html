<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Asamiya · 文件</title>
  <link rel="stylesheet" href="/admin/admin.css" />
</head>
<body>
  <div class="page">

    <header class="topbar">
      <a class="brand" href="/admin/">Asamiya</a>
      <nav>
        <a href="/admin/">概览</a>
        <a href="/admin/posts">文章</a>
        <a href="/admin/files" class="is-active">文件</a>
        <a href="/" target="_blank" rel="noopener">查看站点 ↗</a>
      </nav>
      <div class="spacer"></div>
      <span class="user" id="admin-nav-user"></span>
      <button class="logout" id="admin-logout" type="button">退出</button>
    </header>

    <main class="container">

      <div id="notice" class="notice"></div>

      <div class="dropzone" id="dropzone">
        <div style="font-size:18px;margin-bottom:8px">拖拽文件到这里上传</div>
        <div style="font-size:13px">或 <a href="#" id="pick">点击选择文件</a> · 单文件 ≤ 10MB</div>
        <input type="file" id="file-input" hidden />
      </div>

      <div class="card" style="padding:0">
        <div style="padding:16px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px">
          <strong>已上传文件</strong>
          <span style="color:var(--muted);font-size:13px" id="count"></span>
        </div>
        <div id="grid-wrap" style="padding:20px">
          <div class="empty">加载中…</div>
        </div>
      </div>

    </main>

  </div>

  <script src="/admin/admin.js"></script>
  <script>
    (() => {
      const { api, escapeHtml } = window.admin;
      const noticeEl = document.getElementById('notice');
      const gridWrap = document.getElementById('grid-wrap');
      const countEl  = document.getElementById('count');
      const dropzone = document.getElementById('dropzone');
      const fileInput = document.getElementById('file-input');
      const pickLink = document.getElementById('pick');

      function showNotice(type, msg) {
        noticeEl.className = 'notice ' + type + ' is-visible';
        noticeEl.textContent = msg;
        if (type === 'success') setTimeout(() => { noticeEl.className = 'notice'; }, 2500);
      }

      function fmtSize(n) {
        if (n < 1024) return n + ' B';
        if (n < 1024 * 1024) return (n / 1024).toFixed(1) + ' KB';
        return (n / 1024 / 1024).toFixed(2) + ' MB';
      }

      function isImage(mime) { return /^image\//.test(mime || ''); }

      async function load() {
        gridWrap.innerHTML = '<div class="empty">加载中…</div>';
        try {
          const data = await api('GET', '/api/files');
          countEl.textContent = `共 ${data.total} 个`;
          if (!data.items.length) {
            gridWrap.innerHTML = '<div class="empty">还没有文件。拖一个上去试试 ↑</div>';
            return;
          }
          gridWrap.innerHTML = '<div class="grid">' + data.items.map(f => `
            <div class="tile" data-id="${f.id}" data-url="${escapeHtml(f.url)}" data-name="${escapeHtml(f.original)}">
              <div class="thumb" style="${isImage(f.mime) ? `background-image:url('${escapeHtml(f.url)}')` : ''}">
                ${isImage(f.mime) ? '' : escapeHtml((f.mime || '?').split('/')[1] || '文件').slice(0, 12)}
              </div>
              <div class="meta">
                <div class="name" title="${escapeHtml(f.original)}">${escapeHtml(f.original)}</div>
                <div>${fmtSize(f.size)} · ${escapeHtml((f.mime || '').split('/')[1] || '')}</div>
              </div>
              <div class="actions">
                <button data-act="copy">复制 URL</button>
                <button data-act="del">删除</button>
              </div>
            </div>
          `).join('') + '</div>';

          gridWrap.querySelectorAll('.tile').forEach(tile => {
            tile.querySelector('[data-act=copy]').addEventListener('click', async (e) => {
              e.stopPropagation();
              const url = tile.dataset.url;
              try {
                await navigator.clipboard.writeText(url);
                showNotice('success', '✓ 已复制：' + url);
              } catch {
                prompt('复制此 URL：', url);
              }
            });
            tile.querySelector('[data-act=del]').addEventListener('click', async (e) => {
              e.stopPropagation();
              const id = tile.dataset.id;
              const name = tile.dataset.name;
              if (!confirm(`确定删除《${name}》？`)) return;
              try {
                await api('DELETE', '/api/files/' + id);
                load();
              } catch (err) {
                showNotice('error', '删除失败：' + err.message);
              }
            });
          });
        } catch (err) {
          gridWrap.innerHTML = '<div class="empty">加载失败：' + escapeHtml(err.message) + '</div>';
        }
      }

      async function uploadOne(file) {
        if (!file) return;
        const fd = new FormData();
        fd.append('file', file);
        try {
          await fetch('/api/files', { method: 'POST', body: fd, credentials: 'same-origin' });
          showNotice('success', `✓ ${file.name} 上传成功`);
          load();
        } catch (err) {
          showNotice('error', '上传失败：' + err.message);
        }
      }

      ['dragenter','dragover'].forEach(ev => dropzone.addEventListener(ev, (e) => {
        e.preventDefault();
        dropzone.classList.add('is-dragover');
      }));
      ['dragleave','drop'].forEach(ev => dropzone.addEventListener(ev, (e) => {
        e.preventDefault();
        dropzone.classList.remove('is-dragover');
      }));
      dropzone.addEventListener('drop', (e) => {
        const file = e.dataTransfer.files && e.dataTransfer.files[0];
        if (file) uploadOne(file);
      });
      pickLink.addEventListener('click', (e) => { e.preventDefault(); fileInput.click(); });
      dropzone.addEventListener('click', (e) => {
        if (e.target.tagName === 'A') return;
        fileInput.click();
      });
      fileInput.addEventListener('change', () => {
        const file = fileInput.files && fileInput.files[0];
        if (file) uploadOne(file);
        fileInput.value = '';
      });

      load();
    })();
  </script>
</body>
</html>
