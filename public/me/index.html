<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>个人主页</title>
  <style>
    :root { --fg: #1a1a1a; --muted: #6b6b6b; --accent: #3b82f6; }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0; min-height: 100vh; color: var(--fg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                   "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      font-size: 16px; line-height: 1.6; -webkit-font-smoothing: antialiased;
    }
    body {
      background: url('/image/IMG_20250703_100031.jpeg') center/cover no-repeat fixed;
      position: relative; overflow-x: hidden;
    }
    body::before {
      content: ''; position: fixed; inset: 0;
      background: rgba(255, 255, 255, 0.45);
      backdrop-filter: blur(10px) saturate(120%);
      -webkit-backdrop-filter: blur(10px) saturate(120%);
      pointer-events: none; z-index: 0;
    }
    .wrap { position: relative; z-index: 1; max-width: 620px; margin: 48px auto; padding: 0 20px 64px; }
    h1 { font-family: Georgia, "Times New Roman", "Songti SC", serif; font-weight: 400; font-size: 30px; margin: 0 0 24px; }
    .card {
      background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(20px) saturate(140%);
      -webkit-backdrop-filter: blur(20px) saturate(140%);
      border-radius: 16px; border: 1px solid rgba(255, 255, 255, 0.6);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.08);
      padding: 28px; margin-bottom: 24px;
      animation: fadeUp 0.8s cubic-bezier(0.22, 0.61, 0.36, 1) both;
    }
    h2 {
      font-family: Georgia, "Times New Roman", "Songti SC", serif; font-weight: 400;
      font-size: 14px; text-transform: uppercase; letter-spacing: 2px; color: var(--muted);
      margin: 0 0 20px; padding-bottom: 10px; border-bottom: 1px solid rgba(0, 0, 0, 0.08);
    }
    label { display: block; font-size: 13px; color: var(--muted); margin: 0 0 6px; }
    input[type=text], input[type=email], textarea, input[type=password], input[type=number] {
      width: 100%; padding: 11px 14px; font: inherit; font-size: 15px; color: var(--fg);
      background: rgba(255, 255, 255, 0.6); border: 1px solid rgba(0, 0, 0, 0.1);
      border-radius: 10px; margin: 0 0 16px; outline: none;
      transition: border-color 0.2s ease, background 0.2s ease;
    }
    textarea { resize: vertical; min-height: 80px; }
    input:focus, textarea:focus { border-color: var(--accent); background: rgba(255, 255, 255, 0.9); }
    .btn {
      padding: 10px 18px; background: var(--accent); color: #fff; border: none;
      border-radius: 10px; font: inherit; font-size: 15px; cursor: pointer;
      transition: background 0.2s ease, transform 0.15s ease;
    }
    .btn:hover { background: #2563eb; }
    .btn:active { transform: scale(0.98); }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .btn.ghost { background: transparent; color: var(--muted); border: 1px solid rgba(0,0,0,0.15); }
    .btn.ghost:hover { color: var(--fg); }
    .msg { margin-top: 14px; font-size: 14px; display: none; }
    .msg.ok { color: #15803d; display: block; }
    .msg.bad { color: #b91c1c; display: block; }
    .profile-head {
      display: flex; gap: 24px; align-items: center;
      padding-bottom: 24px; margin-bottom: 24px;
      border-bottom: 1px solid rgba(0, 0, 0, 0.06);
    }
    .avatar {
      width: 96px; height: 96px; border-radius: 50%; object-fit: cover; flex: none;
      background: rgba(0,0,0,0.08); border: 1px solid rgba(0,0,0,0.1);
    }
    .avatar.placeholder { display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 12px; }
    .avatar-actions { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
    .avatar-actions .hint { font-size: 12px; color: var(--muted); }
    .profile-id { flex: 1; min-width: 0; }
    .profile-id .field { margin-bottom: 10px; }
    .profile-id .field:last-child { margin-bottom: 0; }
    .profile-id .lbl {
      display: block; font-size: 12px; color: var(--muted);
      text-transform: uppercase; letter-spacing: 1px; margin-bottom: 4px;
    }
    .profile-id .val { font-size: 15px; color: var(--fg); word-break: break-all; }
    .top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 4px; }
    .top .links { font-size: 13px; }
    .top .links a { color: var(--muted); text-decoration: none; margin-left: 14px; }
    .top .links a:hover { color: var(--fg); }
    .fail { color: #b91c1c; text-align: center; margin-top: 60px; }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
    @media (max-width: 560px) { .profile-head { flex-direction: column; align-items: flex-start; gap: 16px; } }
  </style>
</head>
<body>
  <main class="wrap">
    <div class="top">
      <h1 id="page-title">个人主页</h1>
      <div class="links">
        <a href="/" id="link-home">返回首页</a>
        <a href="#" id="link-logout">退出</a>
      </div>
    </div>
    <div id="app" hidden>
      <section class="card">
        <div class="profile-head">
          <img class="avatar" id="avatar" alt="头像" />
          <div class="avatar-actions">
            <button class="btn ghost" id="btn-avatar">更换头像</button>
            <input type="file" id="avatar-file" accept="image/png,image/jpeg,image/webp,image/gif" hidden />
            <span class="hint">头像 ≤ 100KB（png / jpeg / webp / gif）</span>
          </div>
          <div class="profile-id">
            <div class="field">
              <span class="lbl">用户名</span>
              <span class="val" id="username"></span>
            </div>
            <div class="field">
              <span class="lbl">邮箱</span>
              <span class="val" id="email"></span>
            </div>
          </div>
        </div>
        <div class="msg" id="profile-msg"></div>
      </section>

      <section class="card">
        <h2>编辑名字与签名</h2>
        <label for="name">名字（显示在用户名旁边）</label>
        <input id="name" type="text" maxlength="100" />
        <label for="bio">签名</label>
        <textarea id="bio" maxlength="500" placeholder="一句话介绍自己"></textarea>
        <button class="btn" id="btn-save">保存</button>
        <div class="msg" id="save-msg"></div>
      </section>
    </div>
    <p class="fail" id="fail" hidden>未登录，正在跳转…</p>
  </main>

  <script src="/me/me.js"></script>
</body>
</html>
