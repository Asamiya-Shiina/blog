<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Asamiya · 编辑文章</title>
  <link rel="stylesheet" href="/managers/admin.css" />
  <style>
    /* 分类多选的胶囊勾选样式 */
    .cat-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 12px;
      font-size: 13px;
      color: var(--fg);
      background: rgba(0,0,0,0.03);
      border: 1px solid var(--line);
      border-radius: 999px;
      cursor: pointer;
      user-select: none;
      transition: border-color 0.2s ease, background 0.2s ease;
    }
    .cat-chip:has(input:checked) { border-color: var(--accent); background: rgba(59,130,246,0.08); }
    .cat-chip input { accent-color: var(--accent); }
  </style>
</head>
<body>
  <div class="page">

    <header class="topbar">
      <a class="brand" href="/managers/">Asamiya</a>
      <nav>
        <a href="/managers/">概览</a>
        <a href="/managers/posts">文章</a>
        <a href="/managers/users">用户</a>
        <a href="/managers/status">状态</a>
        <a href="/managers/categories">分类</a>
        <a href="/managers/music">音乐</a>
        <a href="/" target="_blank" rel="noopener">查看站点 ↗</a>
      </nav>
      <div class="spacer"></div>
      <span class="user" id="admin-nav-user"></span>
      <button class="logout" id="admin-logout" type="button">退出</button>
    </header>

    <main class="container wide">

      <div id="notice" class="notice"></div>

      <div class="card">
        <label class="field">
          <span class="lbl">标题</span>
          <input type="text" id="title" maxlength="200" required />
        </label>

        <div style="display:grid;grid-template-columns:1fr 180px;gap:16px">
          <label class="field">
            <span class="lbl">Slug（URL 路径，可自动从标题生成）</span>
            <input type="text" id="slug" maxlength="120" />
          </label>
          <label class="field">
            <span class="lbl">状态</span>
            <select id="status">
              <option value="draft">草稿</option>
              <option value="published">已发布</option>
            </select>
          </label>
        </div>

        <div class="field">
          <span class="lbl">分类（可多选，先选中再发布）</span>
          <div id="cats" style="display:flex;flex-wrap:wrap;gap:8px">
            <span style="color:var(--muted);font-size:13px">加载中…</span>
          </div>
          <div style="display:flex;gap:8px;margin-top:10px">
            <input type="text" id="new-cat" placeholder="新增分类名…" maxlength="50" style="max-width:220px" />
            <button class="btn btn-ghost" id="add-cat" type="button">+ 新增</button>
          </div>
        </div>

        <label class="field">
          <span class="lbl">摘要（可选）</span>
          <textarea id="excerpt" maxlength="500" style="min-height:64px"></textarea>
        </label>
      </div>

      <div class="card">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px">
          <h2 style="margin:0">正文（Markdown）</h2>
          <span style="color:var(--muted);font-size:12px">左侧编辑，右侧实时预览</span>
        </div>
        <div class="editor">
          <textarea id="content_md" class="large"></textarea>
          <div class="preview" id="preview"><div style="color:var(--muted)">预览…</div></div>
        </div>
      </div>

      <div class="card" style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
        <button class="btn btn-primary" id="save">保存草稿</button>
        <button class="btn btn-primary" id="publish">保存并发布</button>
        <a class="btn btn-ghost" href="/managers/posts">返回列表</a>
        <div class="spacer" style="flex:1"></div>
        <button class="btn btn-danger" id="delete" style="display:none">删除</button>
      </div>

    </main>

  </div>

  <script src="/managers/admin.js"></script>
  <script>
    (() => {
      // 从共用库解构 api（fetch 封装）与 escapeHtml（XSS 转义）
      const { api, escapeHtml } = window.admin;
      const $ = (id) => document.getElementById(id);
      const titleEl    = $('title');
      const slugEl     = $('slug');
      const statusEl   = $('status');
      const excerptEl  = $('excerpt');
      const contentEl  = $('content_md');
      const previewEl  = $('preview');
      const noticeEl   = $('notice');
      const saveBtn    = $('save');
      const pubBtn     = $('publish');
      const delBtn     = $('delete');
      const catsEl    = $('cats');     // 分类多选容器
      const newCatEl  = $('new-cat');  // 内联新增分类输入框
      const addCatBtn = $('add-cat');  // 内联新增分类按钮

      // categoryIds：当前文章选中的分类 id 集合（Set）
      let categoryIds = new Set();

      // 渲染分类勾选胶囊。selectedSet 用于编辑模式回填已选分类
      function renderCats(list, selectedSet = new Set()) {
        if (!list.length) {
          catsEl.innerHTML = '<span style="color:var(--muted);font-size:13px">还没有分类，可在下方新增一个。</span>';
          return;
        }
        catsEl.innerHTML = list.map(c => `
          <label class="cat-chip">
            <input type="checkbox" data-cat-id="${c.id}" ${selectedSet.has(c.id) ? 'checked' : ''} />
            ${escapeHtml(c.name)}
          </label>
        `).join('');
      }

      // 拉取全部分类并渲染（新建模式清空选中）
      async function loadCategories() {
        try {
          const data = await api('GET', '/api/categories');
          renderCats(data.items || [], categoryIds);
        } catch { catsEl.innerHTML = '<span style="color:var(--danger);font-size:13px">分类加载失败</span>'; }
      }

      // 内联新增分类：调用后端创建，成功后把新分类加入列表并勾选
      addCatBtn.addEventListener('click', async () => {
        const name = newCatEl.value.trim();
        if (!name) { showNotice('error', '请输入分类名'); return; }
        try {
          const created = await api('POST', '/api/categories', { name });
          categoryIds.add(created.id);
          await loadCategories();
          newCatEl.value = '';
          showNotice('success', '✓ 已新增分类');
        } catch (err) {
          showNotice('error', '新增分类失败：' + (err.data?.error || err.message));
        }
      });
      newCatEl.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); addCatBtn.click(); } });

      // 通过 URL 上的 ?id= 判断是「编辑已有文章」还是「新建文章」
      // postId 为空 → 新建；否则 → 编辑该 id 的文章
      const postId = new URLSearchParams(location.search).get('id');
      // slugDirty：标记用户是否手动改过 slug。false 时标题变了会自动跟着生成 slug，true 则不再覆盖
      let slugDirty = !!slugEl.value;

      function showNotice(type, msg) {
        noticeEl.className = 'notice ' + type + ' is-visible';
        noticeEl.textContent = msg;
      }
      function hideNotice() { noticeEl.className = 'notice'; }

      // 与后端 src/routes/posts.js 的 slugify 一致：小写、空格/下划线转连字符、
      // 去除非字母数字的字符、折叠连续连字符、去首尾连字符、截断到 80 字符
      function slugify(input) {
        return String(input || '')
          .toLowerCase()
          .replace(/[\s_]+/g, '-')
          .replace(/[^\p{Letter}\p{Number}\-]+/gu, '')
          .replace(/-+/g, '-')
          .replace(/^-|-$/g, '')
          .slice(0, 80);
      }

      // 自动生成 slug：用户没手动改过 slug 时，输入标题就实时补上 slug
      titleEl.addEventListener('input', () => {
        if (!slugDirty || !slugEl.value) {
          slugEl.value = slugify(titleEl.value);
          slugDirty = false;
        }
      });
      // 用户一旦手动编辑 slug，就标记为"不再自动覆盖"
      slugEl.addEventListener('input', () => { slugDirty = true; });

      // 右侧实时预览：输入停 300ms 后调 /api/posts/preview 把 Markdown 渲染成 HTML
      // 防抖避免每次击键都发请求
      let previewTimer = null;
      async function refreshPreview() {
        const md = contentEl.value;
        try {
          const { content_html } = await api('POST', '/api/posts/preview', { content_md: md });
          previewEl.innerHTML = content_html || '<div style="color:var(--muted)">（空内容）</div>';
        } catch {
          previewEl.innerHTML = '<div style="color:var(--danger)">预览失败</div>';
        }
      }
      contentEl.addEventListener('input', () => {
        clearTimeout(previewTimer);
        previewTimer = setTimeout(refreshPreview, 300);
      });

      // 保存/发布：status 传 'draft'（仅保存）或 'published'（保存并发布）
    // 单个函数处理两套动作，区别只在 status 与提交后的跳转行为
    async function save(status) {
        const title = titleEl.value.trim();
        const content_md = contentEl.value;
        const slug = slugEl.value.trim();
        const excerpt = excerptEl.value.trim() || null;
        // 前端基础校验：标题、正文都必填，缺失则提示并中止保存
        if (!title)    { showNotice('error', '标题不能为空'); return; }
        if (!content_md) { showNotice('error', '正文不能为空'); return; }
        // 发布是不可逆动作（会展示在前台），先二次确认
        if (status === 'published' && !confirm('确定发布这篇文章吗？')) return;
        statusEl.value = status;
        hideNotice();
        saveBtn.disabled = pubBtn.disabled = true;
        try {
          const payload = { title, content_md, status };
          // 只把用户填了/自动生成了的 slug 和摘要带上，其余交给后端默认
          if (slug) payload.slug = slug;
          if (excerpt) payload.excerpt = excerpt;
          // 收集勾选的分类 id；同步本地的 categoryIds 集合（含新增后勾选的）
          payload.category_ids = Array.from(catsEl.querySelectorAll('input[type=checkbox]:checked'))
            .map(cb => parseInt(cb.dataset.catId, 10))
            .filter(Number.isInteger);
          let res;
          if (postId) {
            // 有 id → 更新已有文章（PUT）
            res = await api('PUT', '/api/posts/' + postId, payload);
          } else {
            // 无 id → 新建（POST），后端会校验 slug 唯一并自动生成
            res = await api('POST', '/api/posts', payload);
          }
          showNotice('success', status === 'published' ? '✓ 已发布' : '✓ 已保存');
          // 发布成功直接回后台首页
          if (status === 'published') {
            setTimeout(() => { location.href = '/managers/'; }, 600);
            return;
          }
          // 新建后把 URL 从「新建」替换成「编辑?id=xx」，这样刷新/删除都能命中同一篇文章
          if (!postId && res.id) {
            history.replaceState(null, '', '/managers/editor?id=' + res.id);
          }
          // 有真实 id 的文章才显示删除按钮，并绑定删除逻辑
          if (res.id) {
            delBtn.style.display = '';
            delBtn.onclick = async () => {
              if (!confirm('确定删除这篇文章？')) return;
              try { await api('DELETE', '/api/posts/' + res.id); location.href = '/managers/posts'; }
              catch (e) { showNotice('error', '删除失败：' + e.message); }
            };
          }
        } catch (err) {
          showNotice('error', err.data?.details?.fieldErrors
            ? JSON.stringify(err.data.details.fieldErrors)
            : '保存失败：' + err.message);
        } finally {
          saveBtn.disabled = pubBtn.disabled = false;
        }
      }

      saveBtn.addEventListener('click', () => save('draft'));
      pubBtn.addEventListener('click',  () => save('published'));

      // —— 页面加载时初始化 ——
      // 有 postId → 拉取该文章内容填进表单（编辑模式）；
      // 无 postId → 空表单（新建模式），直接显示一次空预览
      (async () => {
        // 先加载分类列表（新建模式为空选中）
        await loadCategories();
        if (postId) {
          try {
            const p = await api('GET', '/api/posts/' + postId);
            // 编辑模式：用该文已有分类回填勾选
            categoryIds = new Set((p.categories || []).map(c => c.id));
            await loadCategories();
            titleEl.value   = p.title;
            slugEl.value    = p.slug;
            slugDirty       = true;
            statusEl.value  = p.status;
            excerptEl.value = p.excerpt || '';
            contentEl.value = p.content_md;
            document.title  = 'Asamiya · ' + p.title;
            delBtn.style.display = '';
            delBtn.onclick = async () => {
              if (!confirm('确定删除这篇文章？')) return;
              try { await api('DELETE', '/api/posts/' + postId); location.href = '/managers/posts'; }
              catch (e) { showNotice('error', '删除失败：' + e.message); }
            };
            refreshPreview();
          } catch (err) {
            showNotice('error', '加载失败：' + err.message);
          }
        } else {
          refreshPreview();
        }
      })();
    })();
  </script>
</body>
</html>
