<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Asamiya · 音乐</title>
  <link rel="stylesheet" href="/managers/admin.css" />
  <style>
    .upload-zone {
      border: 2px dashed rgba(0, 0, 0, 0.15);
      border-radius: 14px;
      padding: 32px 24px;
      text-align: center;
      cursor: pointer;
      background: rgba(255, 255, 255, 0.5);
      transition: border-color 0.2s ease, background 0.2s ease;
    }
    .upload-zone:hover,
    .upload-zone.is-dragover {
      border-color: var(--accent);
      background: rgba(59, 130, 246, 0.06);
    }
    .upload-zone .hint {
      color: var(--muted);
      font-size: 13px;
      margin-top: 8px;
    }
    .upload-zone strong { color: var(--fg); }
    .upload-zone input[type=file] { display: none; }

    .active-banner {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 18px;
      background: rgba(59, 130, 246, 0.08);
      border: 1px solid rgba(59, 130, 246, 0.25);
      border-radius: 12px;
      margin-bottom: 16px;
      font-size: 14px;
    }
    .active-banner .badge {
      padding: 2px 10px;
      border-radius: 999px;
      background: var(--accent);
      color: #fff;
      font-size: 12px;
      font-weight: 500;
    }
    .active-banner .name { font-weight: 600; }
    .active-banner .meta { color: var(--muted); font-size: 13px; }

    .tag-active { background: rgba(59, 130, 246, 0.15); color: var(--accent-dark); }
  </style>
</head>
<body>
  <div class="page">

    <header class="topbar">
      <a class="brand" href="/managers/">Asamiya</a>
      <nav>
        <a href="/managers/">概览</a>
        <a href="/managers/posts">文章</a>
        <a href="/managers/users">用户</a>
        <a href="/managers/status">状态</a>
        <a href="/managers/categories">分类</a>
        <a href="/managers/music" class="is-active">音乐</a>
        <a href="/" target="_blank" rel="noopener">查看站点 ↗</a>
      </nav>
      <div class="spacer"></div>
      <span class="user" id="admin-nav-user"></span>
      <button class="logout" id="admin-logout" type="button">退出</button>
    </header>

    <main class="container">

      <div id="notice" class="notice"></div>

      <div id="active-banner"></div>

      <!-- 上传区 -->
      <div class="card">
        <h2>上传歌曲</h2>
        <label class="upload-zone" id="drop-zone">
          <input type="file" id="file" accept="audio/mpeg,audio/mp3,audio/wav,audio/x-wav,audio/wave,audio/ogg,audio/flac,audio/x-flac,audio/mp4,audio/x-m4a,audio/aac,audio/x-aac,.mp3,.wav,.ogg,.flac,.m4a,.aac" />
          <div><strong>点击选择</strong> 或拖拽音频文件到这里</div>
          <div class="hint">支持 MP3 / WAV / OGG / FLAC / M4A / AAC，单文件最大 15MB</div>
        </label>
        <div style="display:flex;gap:10px;align-items:flex-end;margin-top:14px;flex-wrap:wrap">
          <label class="field" style="flex:1;min-width:240px;margin-bottom:0">
            <span class="lbl">显示标题（可选，留空则取文件名）</span>
            <input type="text" id="title" maxlength="200" placeholder="例如：夜曲" />
          </label>
          <button class="btn btn-primary" id="upload-btn" type="button" disabled>上传</button>
        </div>
      </div>

      <!-- 列表 -->
      <div class="card" style="margin-top:24px;padding:0">
        <table>
          <thead>
            <tr>
              <th style="width:42%">标题</th>
              <th style="width:10%">大小</th>
              <th style="width:18%">上传时间</th>
              <th style="width:30%;text-align:right">操作</th>
            </tr>
          </thead>
          <tbody id="rows">
            <tr><td colspan="4" class="empty">加载中…</td></tr>
          </tbody>
        </table>
      </div>

    </main>

  </div>

  <script src="/managers/admin.js"></script>
  <script src="/managers/music/music.js"></script>
</body>
</html>
