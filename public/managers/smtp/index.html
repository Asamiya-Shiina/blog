<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Asamiya · 邮件 SMTP</title>
  <link rel="stylesheet" href="/managers/admin.css" />
</head>
<body>
  <div class="page">
    <header class="topbar">
      <a class="brand" href="/managers/">Asamiya</a>
      <nav>
        <a href="/managers/">概览</a>
        <a href="/managers/posts">文章</a>
        <a href="/managers/users">用户</a>
        <a href="/managers/status">状态</a>
        <a href="/managers/categories">分类</a>
        <a href="/managers/music">音乐</a>
        <a href="/" target="_blank" rel="noopener">查看站点 ↗</a>
      </nav>
      <div class="spacer"></div>
      <span class="user" id="admin-nav-user"></span>
      <button class="logout" id="admin-logout" type="button">退出</button>
    </header>

    <main class="container narrow">
      <section class="card" id="smtp-card" hidden>
        <h2>开放验证邮件（SMTP）</h2>
        <p class="muted" id="smtp-state">加载中…</p>

        <label class="field">
          <span class="lbl">SMTP 服务器（如 smtp.qq.com）</span>
          <input id="smtp-host" type="text" placeholder="smtp.qq.com" />
        </label>
        <label class="field">
          <span class="lbl">端口（587 STARTTLS 或 465 SSL）</span>
          <input id="smtp-port" type="number" value="465" />
        </label>
        <label class="field inline">
          <input id="smtp-secure" type="checkbox" checked />
          <span class="lbl">加密连接（SSL/TLS，端口 465 时勾选）</span>
        </label>
        <label class="field">
          <span class="lbl">账号（邮箱）</span>
          <input id="smtp-user" type="text" placeholder="you@qq.com" />
        </label>
        <label class="field">
          <span class="lbl">应用专用密码（留空则沿用旧密码）</span>
          <input id="smtp-pass" type="password" placeholder="···· ···· ···· ····" />
        </label>
        <label class="field">
          <span class="lbl">发件人显示地址（留空用账号）</span>
          <input id="smtp-sender" type="text" placeholder="you@qq.com" />
        </label>
        <button class="btn btn-primary" id="btn-smtp" type="button">保存 SMTP 配置</button>
        <div class="msg" id="smtp-msg"></div>
      </section>
      <p id="fail" class="muted" hidden>未登录或没有权限，正在跳转…</p>
    </main>
  </div>

  <script src="/managers/admin.js"></script>
  <script src="/managers/smtp/smtp.js"></script>
</body>
</html>
