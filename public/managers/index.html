<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Asamiya · 首页</title>
  <link rel="stylesheet" href="/managers/admin.css" />
</head>
<body>
  <div class="page">

    <header class="topbar">
      <a class="brand" href="/managers/">Asamiya</a>
      <nav>
        <a href="/managers/" class="is-active">概览</a>
        <a href="/managers/posts">文章</a>
        <a href="/managers/users">用户</a>
        <a href="/managers/status">状态</a>
        <a href="/" target="_blank" rel="noopener">查看站点 ↗</a>
      </nav>
      <div class="spacer"></div>
      <span class="user" id="admin-nav-user"></span>
      <button class="logout" id="admin-logout" type="button">退出</button>
    </header>

    <main class="container">

      <div class="stats">
        <div class="stat">
          <div class="num" id="stat-published">—</div>
          <div class="label">已发布</div>
        </div>
        <div class="stat">
          <div class="num" id="stat-draft">—</div>
          <div class="label">草稿</div>
        </div>
      </div>

      <div class="card" style="margin-top:24px">
        <h2>快速操作</h2>
        <div class="toolbar" style="margin-bottom:0">
          <a class="btn btn-primary" href="/managers/editor">+ 新建文章</a>
          <a class="btn btn-ghost" href="/managers/posts">管理文章</a>
        </div>
      </div>

      <div class="card" style="margin-top:24px">
        <h2>最近更新的文章</h2>
        <div id="recent"><div class="empty">加载中…</div></div>
      </div>

    </main>

  </div>

  <script src="/managers/admin.js"></script>
  <script>
    (async () => {
      const { api } = window.admin;
      try {
        const [pub, draft] = await Promise.all([
          api('GET', '/api/posts?status=published&page=1').catch(() => ({ total: 0, items: [] })),
          api('GET', '/api/posts?status=draft&page=1').catch(() => ({ total: 0, items: [] })),
        ]);
        document.getElementById('stat-published').textContent = pub.total;
        document.getElementById('stat-draft').textContent     = draft.total;

        const recent = [...pub.items, ...draft.items]
          .sort((a, b) => (b.updated_at || '').localeCompare(a.updated_at || ''))
          .slice(0, 6);
        const wrap = document.getElementById('recent');
        if (recent.length === 0) {
          wrap.innerHTML = '<div class="empty">还没有文章。<a href="/managers/editor">写一篇 →</a></div>';
        } else {
          wrap.innerHTML = recent.map(p => `
            <div class="row" style="display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer" onclick="window.location.href='/managers/editor?id=${p.id}'">
              <span class="tag ${p.status === 'published' ? 'tag-published' : 'tag-draft'}">${p.status === 'published' ? '已发布' : '草稿'}</span>
              <span style="flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${window.admin.escapeHtml(p.title)}</span>
              <span style="color:var(--muted);font-size:12px">${(p.updated_at || '').replace('T', ' ').slice(0, 16)}</span>
            </div>
          `).join('');
        }
      } catch (e) {
        // guard 已经处理了 401
        console.error(e);
      }
    })();
  </script>
</body>
</html>
