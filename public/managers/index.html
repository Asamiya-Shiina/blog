<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Asamiya · 首页</title>
  <link rel="stylesheet" href="/managers/admin.css" />
</head>
<body>
  <div class="page">

    <header class="topbar">
      <a class="brand" href="/managers/">Asamiya</a>
      <nav>
        <a href="/managers/" class="is-active">概览</a>
        <a href="/managers/posts">文章</a>
        <a href="/managers/users">用户</a>
        <a href="/managers/status">状态</a>
        <a href="/managers/categories">分类</a>
        <a href="/managers/music">音乐</a>
        <a href="/" target="_blank" rel="noopener">查看站点 ↗</a>
      </nav>
      <div class="spacer"></div>
      <span class="user" id="admin-nav-user"></span>
      <button class="logout" id="admin-logout" type="button">退出</button>
    </header>

    <main class="container">

      <div class="stats">
        <div class="stat">
          <div class="num" id="stat-published">—</div>
          <div class="label">已发布</div>
        </div>
        <div class="stat">
          <div class="num" id="stat-draft">—</div>
          <div class="label">草稿</div>
        </div>
      </div>

      <div class="card">
        <h2>最近更新的文章</h2>
        <div id="recent"><div class="empty">加载中…</div></div>
      </div>

    </main>

  </div>

  <script src="/managers/admin.js"></script>
  <script src="/managers/overview.js"></script>
</body>
</html>
