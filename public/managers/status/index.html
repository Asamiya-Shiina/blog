<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Asamiya · 状态管理</title>
  <link rel="stylesheet" href="/managers/admin.css" />
</head>
<body>
  <div class="page">
    <header class="topbar">
      <a class="brand" href="/managers/">Asamiya</a>
      <nav>
        <a href="/managers/">概览</a>
        <a href="/managers/posts">文章</a>
        <a href="/managers/users">用户</a>
        <a href="/managers/status" class="is-active">状态</a>
        <a href="/managers/categories">分类</a>
        <a href="/managers/music">音乐</a>
        <a href="/" target="_blank" rel="noopener">查看站点 ↗</a>
      </nav>
      <div class="spacer"></div>
      <span class="user" id="admin-nav-user"></span>
      <button class="logout" id="admin-logout" type="button">退出</button>
    </header>

    <main class="container">
      <div class="notice" id="notice"></div>

      <!-- 当前状态 -->
      <div class="card">
        <h2>当前状态</h2>
        <div class="status-info" id="current-status">
          <p>加载中...</p>
        </div>
      </div>

      <!-- 黑名单管理 -->
      <div class="card">
        <h2>黑名单</h2>
        <p class="help">匹配这些名称的应用不会被上报。</p>
        <div id="blacklist-list"></div>
        <div class="toolbar" style="margin-top: 12px;">
          <input type="text" id="blacklist-input" placeholder="输入进程名，如 chrome" />
          <button class="btn btn-primary" type="button">添加</button>
        </div>
      </div>

      <!-- 黑名单模式 -->
      <div class="card">
        <h2>黑名单模式（正则）</h2>
        <p class="help">匹配这些正则表达式的窗口标题或进程名不会被上报。</p>
        <div id="patterns-list"></div>
        <div class="toolbar" style="margin-top: 12px;">
          <input type="text" id="pattern-input" placeholder="输入正则，如 .*密码.*" />
          <button class="btn btn-primary" type="button">添加</button>
        </div>
      </div>

      <!-- 应用名映射 -->
      <div class="card">
        <h2>应用名映射</h2>
        <p class="help">将进程名映射为友好的显示名称（精确匹配）。</p>
        <div id="mapping-list"></div>
        <div class="toolbar" style="margin-top: 12px;">
          <input type="text" id="mapping-key" placeholder="进程名" style="width: 140px;" />
          <input type="text" id="mapping-value" placeholder="显示名" style="width: 140px;" />
          <button class="btn btn-primary" type="button">添加</button>
        </div>
      </div>

      <!-- 应用名模式 -->
      <div class="card">
        <h2>应用名模式（正则）</h2>
        <p class="help">用正则表达式匹配进程名，同一开头的进程可归为一类。优先级低于精确映射。</p>
        <div id="app-patterns-list"></div>
        <div class="toolbar" style="margin-top: 12px;">
          <input type="text" id="app-pattern-regex" placeholder="正则，如 ^python" style="width: 160px;" />
          <input type="text" id="app-pattern-name" placeholder="显示名" style="width: 140px;" />
          <button class="btn btn-primary" type="button">添加</button>
        </div>
      </div>

      <!-- 标题应用 -->
      <div class="card">
        <h2>显示标题的应用</h2>
        <p class="help">这些应用会显示完整的窗口标题，其他应用只显示应用名。</p>
        <div id="title-apps-list"></div>
        <div class="toolbar" style="margin-top: 12px;">
          <input type="text" id="title-app-input" placeholder="输入进程名" />
          <button class="btn btn-primary" type="button">添加</button>
        </div>
      </div>

      <!-- 标题应用模式 -->
      <div class="card">
        <h2>标题应用模式（正则）</h2>
        <p class="help">匹配正则的进程会显示完整的窗口标题。</p>
        <div id="title-app-patterns-list"></div>
        <div class="toolbar" style="margin-top: 12px;">
          <input type="text" id="title-app-pattern-input" placeholder="正则，如 ^python" />
          <button class="btn btn-primary" type="button">添加</button>
        </div>
      </div>
    </main>
  </div>

  <script src="/managers/admin.js"></script>
  <script src="/managers/status/status.js"></script>

  <style>
    .status-info p { margin: 4px 0; }
    .help { color: var(--muted); font-size: 13px; margin: 4px 0 8px; }
    .tag {
      display: inline-block;
      padding: 4px 10px;
      background: rgba(0,0,0,0.05);
      border-radius: 6px;
      font-size: 13px;
      margin: 3px;
    }
    .tag-remove {
      cursor: pointer;
      margin-left: 6px;
      color: var(--muted);
    }
    .tag-remove:hover { color: var(--danger); }
    .toolbar {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .toolbar input {
      padding: 6px 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      font-size: 13px;
      outline: none;
    }
    .toolbar input:focus { border-color: var(--accent); }
  </style>
</body>
</html>
