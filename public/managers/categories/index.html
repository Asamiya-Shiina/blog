<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Asamiya · 分类</title>
  <link rel="stylesheet" href="/managers/admin.css" />
</head>
<body>
  <div class="page">

    <header class="topbar">
      <a class="brand" href="/managers/">Asamiya</a>
      <nav>
        <a href="/managers/">概览</a>
        <a href="/managers/posts">文章</a>
        <a href="/managers/users">用户</a>
        <a href="/managers/status">状态</a>
        <a href="/managers/categories" class="is-active">分类</a>
        <a href="/managers/music">音乐</a>
        <a href="/" target="_blank" rel="noopener">查看站点 ↗</a>
      </nav>
      <div class="spacer"></div>
      <span class="user" id="admin-nav-user"></span>
      <button class="logout" id="admin-logout" type="button">退出</button>
    </header>

    <main class="container">

      <div id="notice" class="notice"></div>

      <div class="card flex-gap">
        <input type="text" id="name" placeholder="新分类名…" maxlength="50" class="input-w-300" />
        <button class="btn btn-primary" id="add" type="button">+ 新增分类</button>
      </div>

      <div class="card tight-top">
        <table>
          <thead>
            <tr>
              <th>分类名</th>
              <th class="col-num-15">文章数</th>
              <th class="col-time-15">创建时间</th>
              <th class="col-act-20">操作</th>
            </tr>
          </thead>
          <tbody id="rows">
            <tr><td colspan="4" class="empty">加载中…</td></tr>
          </tbody>
        </table>
      </div>

    </main>

  </div>

  <script src="/managers/admin.js"></script>
  <script src="/managers/categories/categories.js"></script>
</body>
</html>
