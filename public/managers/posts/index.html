<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Asamiya · 文章</title>
  <link rel="stylesheet" href="/managers/admin.css" />
</head>
<body>
  <div class="page">

    <header class="topbar">
      <a class="brand" href="/managers/">Asamiya</a>
      <nav>
        <a href="/managers/">概览</a>
        <a href="/managers/posts" class="is-active">文章</a>
        <a href="/managers/users">用户</a>
        <a href="/managers/status">状态</a>
        <a href="/managers/music">音乐</a>
        <a href="/" target="_blank" rel="noopener">查看站点 ↗</a>
      </nav>
      <div class="spacer"></div>
      <span class="user" id="admin-nav-user"></span>
      <button class="logout" id="admin-logout" type="button">退出</button>
    </header>

    <main class="container">

      <div class="toolbar">
        <input type="search" id="q" placeholder="搜索标题、摘要或正文…" />
        <select id="status" style="max-width:140px">
          <option value="">全部状态</option>
          <option value="published">已发布</option>
          <option value="draft">草稿</option>
        </select>
        <button class="btn btn-ghost" id="search-btn" type="button">搜索</button>
        <div class="spacer" style="flex:1"></div>
        <a class="btn btn-primary" href="/managers/editor">+ 新建文章</a>
      </div>

      <div class="card" style="padding:0">
        <table>
          <thead>
            <tr>
              <th style="width:50%">标题</th>
              <th style="width:12%">状态</th>
              <th style="width:18%">更新时间</th>
              <th style="width:20%;text-align:right">操作</th>
            </tr>
          </thead>
          <tbody id="rows">
            <tr><td colspan="4" class="empty">加载中…</td></tr>
          </tbody>
        </table>
      </div>

      <div class="toolbar" style="margin-top:16px;justify-content:flex-end">
        <button class="btn btn-ghost" id="prev" type="button" disabled>上一页</button>
        <span id="page-info" style="color:var(--muted);font-size:13px"></span>
        <button class="btn btn-ghost" id="next" type="button" disabled>下一页</button>
      </div>

    </main>

  </div>

  <script src="/managers/admin.js"></script>
  <script>
    (() => {
      // 从共用库解构 api（fetch 封装）与 escapeHtml（XSS 转义）
      const { api, escapeHtml } = window.admin;
      const rowsEl   = document.getElementById('rows');
      const qEl      = document.getElementById('q');        // 搜索关键字输入框
      const statusEl = document.getElementById('status');   // 状态筛选下拉（全部/已发布/草稿）
      const prevBtn  = document.getElementById('prev');
      const nextBtn  = document.getElementById('next');
      const pageInfo = document.getElementById('page-info');

      let page = 1;   // 当前页码，翻页/筛选时更新

      // 拉取并渲染一页文章
      async function load() {
        // 把搜索关键字、状态筛选用 query 参数拼到请求里
        const params = new URLSearchParams({ page });
        const q = qEl.value.trim();
        if (q) params.set('q', q);
        const st = statusEl.value;
        if (st) params.set('status', st);

        rowsEl.innerHTML = '<tr><td colspan="4" class="empty">加载中…</td></tr>';
        try {
          const data = await api('GET', '/api/posts?' + params);
          if (!data.items.length) {
            rowsEl.innerHTML = '<tr><td colspan="4" class="empty">没有文章。<a href="/managers/editor">写一篇 →</a></td></tr>';
          } else {
            rowsEl.innerHTML = data.items.map(p => `
              <tr class="row" onclick="window.location.href='/managers/editor?id=${p.id}'">
                <td><strong>${escapeHtml(p.title)}</strong>${p.excerpt ? `<div style="color:var(--muted);font-size:12px;margin-top:2px">${escapeHtml(p.excerpt)}</div>` : ''}</td>
                <td><span class="tag ${p.status === 'published' ? 'tag-published' : 'tag-draft'}">${p.status === 'published' ? '已发布' : '草稿'}</span></td>
                <td style="color:var(--muted);font-size:13px">${(p.updated_at || '').replace('T', ' ').slice(0, 16)}</td>
                <td style="text-align:right">
                  <button class="btn btn-ghost" onclick="event.stopPropagation(); window.location.href='/managers/editor?id=${p.id}'">编辑</button>
                  <button class="btn btn-danger" data-id="${p.id}" data-title="${escapeHtml(p.title)}">删除</button>
                </td>
              </tr>
            `).join('');
            // 给每行的删除按钮绑事件（用事件委托遍历查询，避免逐个闭包绑定）
            rowsEl.querySelectorAll('.btn-danger').forEach(b => {
              b.addEventListener('click', async (e) => {
                e.stopPropagation();   // 阻止冒泡，避免误触整行的「点此行进编辑」
                const id = b.dataset.id;
                const title = b.dataset.title;
                if (!confirm(`确定删除《${title}》？此操作不可恢复。`)) return;
                try {
                  await api('DELETE', '/api/posts/' + id);
                  load();   // 删除后刷新当前页
                } catch (err) {
                  alert('删除失败：' + err.message);
                }
              });
            });
          }
          // 更新分页按钮可用态与页码信息
          const totalPages = Math.max(1, Math.ceil(data.total / data.page_size));
          pageInfo.textContent = `第 ${page} / ${totalPages} 页 · 共 ${data.total} 篇`;
          prevBtn.disabled = page <= 1;
          nextBtn.disabled = page >= totalPages;
        } catch (err) {
          rowsEl.innerHTML = `<tr><td colspan="4" class="empty">加载失败：${escapeHtml(err.message)}</td></tr>`;
        }
      }

      // 搜索/筛选切换时都回到第 1 页再刷新；上下页则直接当前页±1
      document.getElementById('search-btn').addEventListener('click', () => { page = 1; load(); });
      qEl.addEventListener('keydown', e => { if (e.key === 'Enter') { page = 1; load(); } });
      statusEl.addEventListener('change', () => { page = 1; load(); });
      prevBtn.addEventListener('click', () => { page--; load(); });
      nextBtn.addEventListener('click', () => { page++; load(); });

      load();   // 首屏渲染
    })();
  </script>
</body>
</html>
