<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>注册</title>
  <link rel="stylesheet" href="/register/register.css" />
</head>
<body>
  <main class="wrap">
    <form class="card" id="reg-form" autocomplete="on" novalidate>
      <h1>注册</h1>
      <p class="subtitle">创建一个账号</p>
      <div class="error" id="error" role="alert"></div>
      <div class="ok" id="ok" role="status"></div>
      <label for="username">用户名</label>
      <input id="username" name="username" type="text" autocomplete="username" required autofocus pattern="[a-zA-Z0-9_-]{1,64}" title="字母、数字、下划线、连字符" />
      <label for="email">邮箱</label>
      <input id="email" name="email" type="email" autocomplete="email" required />
      <p class="hint">
        注册后我们会向该邮箱发送验证链接，点击链接即可设置密码并激活账号。
      </p>

      <!-- 自写滑块 -->
      <div class="captcha">
        <span class="captcha-label" id="captcha-label">安全验证：把滑块拖到缺口位置</span>
        <div class="track" id="track">
          <div class="notch hidden" id="notch"></div>
          <div class="handle" id="handle">→</div>
        </div>
      </div>

      <button class="submit" id="submit" type="submit">注册</button>
      <p class="foot"><a href="/login/">← 已有账号？去登录</a></p>
      <p class="foot mt-4"><a href="/">返回首页</a></p>
    </form>
  </main>

  <script src="/register/register.js"></script>
</body>
</html>
