<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>注册</title>
  <style>
    :root { --fg: #1a1a1a; --muted: #6b6b6b; }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0; min-height: 100vh;
      color: var(--fg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                   "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      font-size: 16px; line-height: 1.6; -webkit-font-smoothing: antialiased;
    }
    body {
      background: url('/image/IMG_20250703_100031.jpeg') center/cover no-repeat fixed;
      position: relative; overflow: hidden;
    }
    body::before {
      content: ''; position: fixed; inset: 0;
      background: rgba(255, 255, 255, 0.40);
      backdrop-filter: blur(8px) saturate(120%);
      -webkit-backdrop-filter: blur(8px) saturate(120%);
      pointer-events: none; z-index: 0;
      animation: maskIn 1.1s cubic-bezier(0.22, 0.61, 0.36, 1) both;
    }
    .wrap {
      position: relative; z-index: 1; min-height: 100vh;
      display: flex; align-items: center; justify-content: center; padding: 24px;
    }
    .card {
      width: 100%; max-width: 380px; padding: 40px 32px;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(20px) saturate(140%);
      -webkit-backdrop-filter: blur(20px) saturate(140%);
      border-radius: 16px; border: 1px solid rgba(255, 255, 255, 0.6);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
      animation: fadeUp 0.9s cubic-bezier(0.22, 0.61, 0.36, 1) both;
    }
    h1 { font-family: Georgia, "Times New Roman", "Songti SC", serif; font-weight: 400; font-size: 28px; margin: 0 0 8px; text-align: center; }
    .subtitle { color: var(--muted); text-align: center; margin: 0 0 28px; font-size: 14px; }
    label { display: block; font-size: 13px; color: var(--muted); margin: 0 0 6px; }
    input[type=text], input[type=password], input[type=email] {
      width: 100%; padding: 12px 14px; font: inherit; font-size: 15px; color: var(--fg);
      background: rgba(255, 255, 255, 0.6); border: 1px solid rgba(0, 0, 0, 0.1);
      border-radius: 10px; margin: 0 0 16px; outline: none;
      transition: border-color 0.2s ease, background 0.2s ease;
    }
    input:focus { border-color: #3b82f6; background: rgba(255, 255, 255, 0.9); }
    .submit {
      width: 100%; padding: 12px; background: #3b82f6; color: #fff; border: none;
      border-radius: 10px; font: inherit; font-size: 15px; font-weight: 500;
      cursor: pointer; margin-top: 8px; transition: background 0.2s ease, transform 0.15s ease;
    }
    .submit:hover { background: #2563eb; }
    .submit:active { transform: scale(0.98); }
    .submit:disabled { opacity: 0.6; cursor: not-allowed; }
    .error {
      color: #b91c1c; background: rgba(220, 38, 38, 0.08); border-radius: 8px;
      padding: 10px 12px; font-size: 14px; margin: 0 0 16px; display: none;
    }
    .error.is-visible { display: block; }
    .ok {
      color: #15803d; background: rgba(34, 197, 94, 0.1); border-radius: 8px;
      padding: 10px 12px; font-size: 14px; margin: 0 0 16px; display: none;
    }
    .ok.is-visible { display: block; }
    .foot { text-align: center; margin-top: 14px; font-size: 13px; color: var(--muted); }
    .foot a { color: var(--muted); text-decoration: none; }
    .foot a:hover { color: var(--fg); }

    /* 滑块验证 */
    .captcha { margin: 0 0 16px; }
    .captcha-label { display: block; font-size: 13px; color: var(--muted); margin: 0 0 8px; }
    .track {
      position: relative; height: 44px; border-radius: 10px; overflow: hidden;
      background: rgba(0, 0, 0, 0.06); border: 1px solid rgba(0, 0, 0, 0.12);
      touch-action: none; user-select: none;
    }
    .track .notch {
      position: absolute; top: 0; bottom: 0; background: #cbd5e1;
      border: 1px inset rgba(0, 0, 0, 0.08); border-radius: 8px; box-sizing: border-box;
    }
    .track .handle {
      position: absolute; top: 0; bottom: 0;
      display: flex; align-items: center; justify-content: center;
      background: #3b82f6; color: #fff; border-radius: 8px; cursor: grab;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2); transition: left 0.05s linear;
      touch-action: none; user-select: none;
    }
    .track .handle.dragging { cursor: grabbing; }
    .track .handle.verified { background: #22c55e; }
    .track .handle.invalid { background: #ef4444; animation: shake 0.5s; }
    .track.verified-hide { opacity: 0; transition: opacity 0.4s; }
    .captcha-label.ok { color: #16a34a; }
    .captcha-label.bad { color: #dc2626; }
    .captcha.gone { display: none; }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-9px); }
      40% { transform: translateX(9px); }
      60% { transform: translateX(-6px); }
      80% { transform: translateX(6px); }
    }
    @keyframes maskIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body>
  <main class="wrap">
    <form class="card" id="reg-form" autocomplete="on" novalidate>
      <h1>注册</h1>
      <p class="subtitle">创建一个账号</p>
      <div class="error" id="error" role="alert"></div>
      <div class="ok" id="ok" role="status"></div>
      <label for="username">用户名</label>
      <input id="username" name="username" type="text" autocomplete="username" required autofocus pattern="[a-zA-Z0-9_-]{1,64}" title="字母、数字、下划线、连字符" />
      <label for="email">邮箱</label>
      <input id="email" name="email" type="email" autocomplete="email" required />
      <label for="password">密码（至少 8 位）</label>
      <input id="password" name="password" type="password" autocomplete="new-password" minlength="8" required />
      <label for="confirm">确认密码</label>
      <input id="confirm" name="confirm" type="password" autocomplete="new-password" required />

      <!-- 自写滑块 -->
      <div class="captcha">
        <span class="captcha-label" id="captcha-label">安全验证：把滑块拖到缺口位置</span>
        <div class="track" id="track">
          <div class="notch" id="notch" style="display:none"></div>
          <div class="handle" id="handle">→</div>
        </div>
      </div>

      <button class="submit" id="submit" type="submit">注册</button>
      <p class="foot"><a href="/login/">← 已有账号？去登录</a></p>
      <p class="foot" style="margin-top:4px"><a href="/">返回首页</a></p>
    </form>
  </main>

  <script>
    (function () {
      async function sha256(str) {
        const data = new TextEncoder().encode(str);
        const buf = await crypto.subtle.digest('SHA-256', data);
        return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
      }
      const form = document.getElementById('reg-form');
      const err = document.getElementById('error');
      const ok = document.getElementById('ok');
      const btn = document.getElementById('submit');
      const track = document.getElementById('track');
      const handle = document.getElementById('handle');
      const notch = document.getElementById('notch');
      const label = document.getElementById('captcha-label');

      let captcha = null;    // { token, targetX, width, sliderWidth }
      let dragging = false;
      let verifiedX = null;  // 拖到位时记住的坐标（captcha 坐标系）

      const showErr = (m) => { err.textContent = m; err.classList.add('is-visible'); };
      const hideErr = () => err.classList.remove('is-visible');
      const showOk = (m) => { ok.textContent = m; ok.classList.add('is-visible'); };

      // 载入滑块
      async function loadCaptcha() {
        try {
          const res = await fetch('/api/captcha');
          captcha = await res.json();
          form.hidden = false;
        } catch {
          showErr('无法加载验证码，请刷新重试');
          return;
        }
        // 画缺口
        const trackW = track.clientWidth;
        const scale = trackW / captcha.width;         // 响应式缩放
        const notchX = captcha.targetX * scale;
        const notchW = captcha.sliderWidth * scale;
        const handleW = notchW;
        notch.style.left = notchX + 'px';
        notch.style.width = notchW + 'px';
        notch.style.display = 'block';
        handle.style.left = '0px';
        handle.style.width = handleW + 'px';
        const maxLeft = trackW - handleW;
        // 重置上轮验证的视觉状态
        verifiedX = null;
        label.className = 'captcha-label';
        label.textContent = '安全验证：把滑块拖到缺口位置';
        handle.classList.remove('verified', 'invalid');
        handle.style.animation = '';
        track.classList.remove('verified-hide');

        const setPos = (clientX) => {
          const rect = track.getBoundingClientRect();
          let pos = clientX - rect.left - handleW / 2;
          pos = Math.max(0, Math.min(maxLeft, pos));
          handle.style.left = pos + 'px';
        };

        handle.addEventListener('pointerdown', (e) => {
          dragging = true;
          handle.classList.add('dragging');
          handle.setPointerCapture(e.pointerId);
        });
        handle.addEventListener('pointermove', (e) => {
          if (!dragging) return;
          setPos(e.clientX);
        });
        handle.addEventListener('pointerup', (e) => {
          if (!dragging) return;
          dragging = false;
          handle.classList.remove('dragging');
          // 松手瞬间的坐标可能没经过 pointermove，用它精确落位再判定，避免差一截
          setPos(e.clientX);
          const pos = parseFloat(handle.style.left) || 0;
          if (Math.abs(pos - notchX) <= 14) {
            // 对准缺口：滑块变绿，整条滑动条一起淡出，记住坐标供提交
            verifiedX = pos / scale;
            label.textContent = '验证成功';
            label.classList.add('ok');
            handle.classList.add('verified');
            track.classList.add('verified-hide');
            // 淡出完成后（400ms）+ 多停一会再折叠，按钮才慢慢顶上来
            setTimeout(() => track.parentElement.classList.add('gone'), 1200);
          } else {
            // 没对准：变红 + 摇晃，延时后重新生成缺口
            label.textContent = '验证失败，请重新验证';
            label.classList.add('bad');
            handle.classList.add('invalid');
            setTimeout(loadCaptcha, 550);
          }
        });
      }
      loadCaptcha();

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        hideErr();
        const username = document.getElementById('username').value.trim();
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;
        const confirm = document.getElementById('confirm').value;

        if (!username || !email || !password) { showErr('请填写所有字段'); return; }
        if (!/^[a-zA-Z0-9_-]{1,64}$/.test(username)) { showErr('用户名只能含字母、数字、下划线、连字符'); return; }
        if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { showErr('邮箱格式不正确'); return; }
        if (password.length < 8) { showErr('密码至少 8 个字符'); return; }
        if (password !== confirm) { showErr('两次输入的密码不一致'); return; }
        if (!captcha) { showErr('验证码未加载，请稍等'); return; }
        if (typeof verifiedX !== 'number') { showErr('请先把滑块拖到缺口位置'); return; }

        btn.disabled = true;
        btn.textContent = '注册中…';
        try {
          const password_hash = await sha256(password);
          const res = await fetch('/api/register', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, email, password_hash, captcha_token: captcha.token, captcha_x: verifiedX }),
          });
          if (res.status === 201) {
            const data = await res.json();
            if (data.needsVerify) {
              showOk('注册成功，验证邮件已发送，请到邮箱点击链接完成验证。');
              form.querySelectorAll('input').forEach(i => i.value = '');
            } else {
              window.location.href = '/me/';
            }
            return;
          }
          const data = await res.json().catch(() => ({}));
          const msgMap = {
            409: '用户名或邮箱已存在', 429: '操作太频繁，请稍后再试', 400: '请求不合法，请检查输入',
          };
          showErr(data.error === 'captcha failed' ? '验证码校验失败，请重新拖动' : (msgMap[res.status] || (data.error || '注册失败 (' + res.status + ')')));
          loadCaptcha(); // 失败后重置滑块
        } catch (err2) {
          console.error('注册异常:', err2);
          showErr('网络错误: ' + (err2.message || err2));
        } finally {
          btn.disabled = false;
          btn.textContent = '注册';
        }
      });
    })();
  </script>
</body>
</html>
