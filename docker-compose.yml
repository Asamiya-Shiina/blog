services:
  blog:
    image: ghcr.io/asamiya-shiina/blog:latest
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - COOKIE_SECURE=false
    volumes:
      - ./data:/app/data
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
          pids: 100
    read_only: true
    tmpfs:
      - /tmp
