services:
  blog:
    image: ghcr.io/asamiya-shiina/blog:latest
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - TRUST_PROXY=1
      # 限制 V8 旧生代堆，收紧常驻内存并让 GC 更积极；按需微调
      - NODE_OPTIONS=--max-old-space-size=128
    volumes:
      - ./data:/app/data
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
          pids: 100
    read_only: true
    tmpfs:
      - /tmp
