# 生产部署提示：
#   - SITE_URL 必填，例 https://yourblog.com；未设则邮件验证链接按 ALLOWED_HOSTS 白名单
#     解析，未在白名单内的 Host 一律拒绝发信（防 Host 头注入把验证令牌引到他域）
#   - TRUST_PROXY 与「应用端口不得直连公网」必须同时成立：
#     3000 已绑回环，应由前置 Nginx/Caddy 反代连入。
#     若反代未覆盖 TRUST_PROXY=1，任何人都能伪造 X-Forwarded-For 绕过 IP 限流
#   - 512MB 容器建议加 ENABLE_GEOIP=false（geoip-lite 整库常驻约 100MB）
#
# 这些提示只在源码里方便维护者；运行时只保留实际生效项。

services:
  blog:
    image: ghcr.io/asamiya-shiina/blog:latest
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - NODE_ENV=production
      - TRUST_PROXY=1
      - NODE_OPTIONS=--max-old-space-size=96 --max-semi-space-size=8
    volumes:
      - ./data:/app/data
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
          pids: 100
    read_only: true
    tmpfs:
      - /tmp