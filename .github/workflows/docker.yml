name: Build & Push Docker Image

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: asamiya-shiina/blog

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      # 供应链加固：所有 actions 用 commit SHA 固定（不用 @vN mutable tag），
      # 即使上游 tag 被劫持/移动也只在具备 packages:write 的发布上下文里跑预期代码。
      # 更新方法：gh api repos/<repo>/git/refs/tags/<ref> --jq .object.sha
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 创建 docker-container driver 的 buildx builder。
      # 必须：provenance/attestation 只支持 docker-container driver，
      # runner 默认的 docker driver 会用不了（build 直接 fail）。
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          # 生成来源证明，便于追溯镜像由哪次提交、哪个 workflow 产出
          provenance: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
